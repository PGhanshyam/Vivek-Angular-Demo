<div class="settings-page">

    <!-- ========================================= -->
    <!-- Header with Breadcrumb and Pill Tabs      -->
    <!-- ========================================= -->
    <div class="page-header">
        <div class="breadcrumb">
            <span class="settings-title">Settings</span>
            <span class="separator">/</span>
            <span class="active-title">Terms and Conditions</span>
        </div>

        <!-- Settings Pill Tabs -->
        <div class="settings-tabs">
            <a routerLink="/settings/privacy-policy" class="tab">
                Privacy Policy
            </a>
            <a routerLink="/settings/terms-conditions" class="tab active">
                Terms and Conditions
            </a>
            <a routerLink="/settings/about" class="tab">
                About
            </a>
            <a routerLink="/settings/testimonials" class="tab">
                Testimonial
            </a>
            <a routerLink="/settings/general" class="tab">
                General
            </a>
        </div>
    </div>

    <!-- ========================================= -->
    <!-- Main Editor Content Card                  -->
    <!-- ========================================= -->
    <div class="content-card">

        <!-- Loading State -->
        <div *ngIf="isLoading" class="loading">
            Loading Terms and Conditions...
        </div>

        <!-- Editor Section -->
        <div [hidden]="isLoading" class="editor-wrapper">

            <!-- Editor Toolbar -->
            <div class="editor-toolbar">

                <!-- Text Styling Group -->
                <button type="button" class="tool-btn" title="Bold" (click)="format('bold')">
                    <strong>B</strong>
                </button>

                <button type="button" class="tool-btn" title="Italic" (click)="format('italic')">
                    <em>I</em>
                </button>

                <button type="button" class="tool-btn" title="Underline" (click)="format('underline')">
                    <u>U</u>
                </button>

                <!-- Paragraph Dropdown -->
                <div class="select-dropdown">
                    <select title="Paragraph" (change)="formatBlock($any($event.target).value)">
                        <option value="p">Paragraph</option>
                        <option value="h2">Heading 2</option>
                        <option value="h3">Heading 3</option>
                        <option value="h4">Heading 4</option>
                    </select>
                </div>

                <span class="toolbar-separator"></span>

                <!-- Alignment Icons -->
                <button type="button" class="tool-btn icon-btn" title="Align Left" (click)="format('justifyLeft')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="17" y1="10" x2="3" y2="10"></line>
                        <line x1="21" y1="6" x2="3" y2="6"></line>
                        <line x1="21" y1="14" x2="3" y2="14"></line>
                        <line x1="17" y1="18" x2="3" y2="18"></line>
                    </svg>
                </button>

                <button type="button" class="tool-btn icon-btn" title="Align Center" (click)="format('justifyCenter')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="18" y1="10" x2="6" y2="10"></line>
                        <line x1="21" y1="6" x2="3" y2="6"></line>
                        <line x1="21" y1="14" x2="3" y2="14"></line>
                        <line x1="18" y1="18" x2="6" y2="18"></line>
                    </svg>
                </button>

                <button type="button" class="tool-btn icon-btn" title="Align Right" (click)="format('justifyRight')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="21" y1="10" x2="7" y2="10"></line>
                        <line x1="21" y1="6" x2="3" y2="6"></line>
                        <line x1="21" y1="14" x2="3" y2="14"></line>
                        <line x1="21" y1="18" x2="7" y2="18"></line>
                    </svg>
                </button>

                <!-- List Icons -->
                <button type="button" class="tool-btn icon-btn" title="Bullet List" (click)="insertUnorderedList()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>

                <button type="button" class="tool-btn icon-btn" title="Numbered List" (click)="insertOrderedList()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="10" y1="6" x2="21" y2="6"></line>
                        <line x1="10" y1="12" x2="21" y2="12"></line>
                        <line x1="10" y1="18" x2="21" y2="18"></line>
                        <path d="M4 6h1v4"></path>
                        <path d="M4 10h2"></path>
                        <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
                    </svg>
                </button>

                <span class="toolbar-separator"></span>

                <!-- Script Toggles -->
                <button type="button" class="tool-btn script-btn" title="Superscript" (click)="format('superscript')">
                    X<sup>2</sup>
                </button>

                <button type="button" class="tool-btn script-btn" title="Subscript" (click)="format('subscript')">
                    X<sub>2</sub>
                </button>

                <span class="toolbar-separator"></span>

                <!-- Table, Link, Image Insert Options -->
                <button type="button" class="tool-btn icon-btn" title="Insert Table" (click)="insertTable()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="3" y1="15" x2="21" y2="15"></line>
                        <line x1="12" y1="3" x2="12" y2="21"></line>
                    </svg>
                </button>

                <button type="button" class="tool-btn icon-btn" title="Insert Link" (click)="createLink()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                </button>

                <button type="button" class="tool-btn icon-btn" title="Insert Image" (click)="insertImage()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>

            </div>

            <!-- Editable Content Area -->
            <div #editor class="rich-text-editor" contenteditable="true" spellcheck="true">
            </div>

        </div>

    </div>

    <!-- Bottom Right Action Buttons -->
    <div class="action-buttons">
        <button type="button" class="update-button" [disabled]="isSaving" (click)="update()">
            {{ isSaving ? 'Updating...' : 'Update' }}
        </button>

        <button type="button" class="cancel-button" [disabled]="isSaving" (click)="cancel()">
            Cancel
        </button>
    </div>

</div>
