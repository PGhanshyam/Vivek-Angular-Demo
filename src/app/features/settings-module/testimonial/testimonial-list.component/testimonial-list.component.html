<div class="settings-page">

    <!-- ========================================= -->
    <!-- Page Header & Pill Tabs                   -->
    <!-- ========================================= -->
    <div class="page-header">
        <div class="breadcrumb">
            <span class="settings-title">Settings</span>
            <span class="separator">/</span>
            <span class="active-title">Testimonial</span>
        </div>

        <!-- Settings Pill Tabs -->
        <div class="settings-tabs">
            <a routerLink="/settings/privacy-policy" class="tab">
                Privacy Policy
            </a>
            <a routerLink="/settings/terms-conditions" class="tab">
                Terms and Conditions
            </a>
            <a routerLink="/settings/about" class="tab">
                About
            </a>
            <a routerLink="/settings/testimonials" class="tab active">
                Testimonial
            </a>
            <a routerLink="/settings/general" class="tab">
                General
            </a>
        </div>
    </div>

    <!-- Action Bar ("Add Content" Button) -->
    <div class="action-bar">
        <button type="button" class="add-button" (click)="addTestimonial()">
            Add Content
        </button>
    </div>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
        Loading testimonials...
    </div>

    <!-- Empty State -->
    <div class="empty-container" *ngIf="!isLoading && testimonials.length === 0">
        No testimonials found.
    </div>

    <!-- Testimonial 2-Column Grid -->
    <div class="testimonial-grid" *ngIf="!isLoading && testimonials.length > 0">
        <div class="testimonial-card" *ngFor="let testimonial of testimonials; let i = index">
            <!-- Pink Top-Left Number Box -->
            <div class="testimonial-number">
                {{ testimonial.displayOrder ?? testimonial.DisplayOrder ?? (i + 1) }}
            </div>

            <!-- Testimonial Quote & Author -->
            <div class="testimonial-content">
                <div class="content-text" [innerHTML]="testimonial.content || testimonial.Content"></div>
                <div class="author" *ngIf="testimonial.author || testimonial.Author">
                    - {{ testimonial.author || testimonial.Author }}
                </div>
            </div>

            <!-- Bottom-Right Action Icons -->
            <div class="testimonial-actions">
                <!-- Edit -->
                <button type="button" class="action-btn edit-btn" title="Edit"
                    (click)="editTestimonial(testimonial.testimonialId || testimonial.TestimonialId || testimonial.id)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>

                <!-- Delete -->
                <button type="button" class="action-btn delete-btn" title="Delete"
                    (click)="deleteTestimonial(testimonial.testimonialId || testimonial.TestimonialId || testimonial.id)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

</div>
