<!-- Modal Overlay Backdrop -->
<div class="modal-overlay" (click)="closeModal()">

    <!-- Modal Box -->
    <div class="testimonial-modal" (click)="$event.stopPropagation()">

        <!-- Modal Header -->
        <div class="modal-header">
            <h2>Add Testimonial Content</h2>

            <button type="button" class="close-button" (click)="closeModal()" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
            </button>
        </div>

        <!-- Form -->
        <form [formGroup]="testimonialForm" (ngSubmit)="onSubmit()" class="modal-form">

            <!-- Content Area with Rich-Text Style Toolbar -->
            <div class="form-group content-editor-group">

                <div class="editor-header-bar">
                    <label>Add Content</label>

                    <!-- Inline Editor Mini-Toolbar -->
                    <div class="mini-toolbar">
                        <button type="button" class="tool-btn" title="Bold"><strong>B</strong></button>
                        <button type="button" class="tool-btn" title="Italic"><em>I</em></button>
                        <button type="button" class="tool-btn" title="Underline"><u>U</u></button>

                        <div class="dropdown-wrapper">
                            <select title="Format">
                                <option>Paragraph</option>
                                <option>Heading 2</option>
                                <option>Heading 3</option>
                            </select>
                        </div>

                        <!-- Alignment -->
                        <button type="button" class="tool-btn icon-btn" title="Align Left">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round">
                                <line x1="17" y1="10" x2="3" y2="10"></line>
                                <line x1="21" y1="6" x2="3" y2="6"></line>
                                <line x1="21" y1="14" x2="3" y2="14"></line>
                                <line x1="17" y1="18" x2="3" y2="18"></line>
                            </svg>
                        </button>

                        <!-- Lists -->
                        <button type="button" class="tool-btn icon-btn" title="Bullet List">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>

                        <button type="button" class="tool-btn icon-btn" title="Numbered List">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round">
                                <line x1="10" y1="6" x2="21" y2="6"></line>
                                <line x1="10" y1="12" x2="21" y2="12"></line>
                                <line x1="10" y1="18" x2="21" y2="18"></line>
                                <path d="M4 6h1v4"></path>
                                <path d="M4 10h2"></path>
                                <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
                            </svg>
                        </button>

                        <!-- Scripts -->
                        <button type="button" class="tool-btn" title="Superscript">X<sup>2</sup></button>
                        <button type="button" class="tool-btn" title="Subscript">X<sub>2</sub></button>

                        <!-- Media / Link -->
                        <button type="button" class="tool-btn icon-btn" title="Table">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="3" y1="9" x2="21" y2="9"></line>
                                <line x1="3" y1="15" x2="21" y2="15"></line>
                                <line x1="12" y1="3" x2="12" y2="21"></line>
                            </svg>
                        </button>

                        <button type="button" class="tool-btn icon-btn" title="Link">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                        </button>

                        <button type="button" class="tool-btn icon-btn" title="Image">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>

                <textarea formControlName="content" rows="5"
                    placeholder="“I used to be skeptical about the benefits of Yoga but I've found Rakhee's classes have enabled me to take better care of myself mentally, physically, spiritually and emotionally.”"
                    [class.invalid-input]="formControls['content'].touched && formControls['content'].invalid"></textarea>

                <small *ngIf="formControls['content'].touched && formControls['content'].invalid" class="error-msg">
                    {{
                    formControls['content'].errors?.['required']
                    ? 'Testimonial content is required.'
                    : 'Content cannot exceed 5000 characters.'
                    }}
                </small>
            </div>

            <!-- Person Name Field -->
            <div class="form-group">
                <label>Person Name</label>
                <input type="text" formControlName="author" placeholder="- Kajal Meghani, Finchley class student"
                    [class.invalid-input]="formControls['author'].touched && formControls['author'].invalid" />

                <small *ngIf="formControls['author'].touched && formControls['author'].invalid" class="error-msg">
                    {{
                    formControls['author'].errors?.['required']
                    ? 'Person name is required.'
                    : 'Person name cannot exceed 255 characters.'
                    }}
                </small>
            </div>

            <!-- Display Order Field -->
            <div class="form-group">
                <label>Display Order</label>
                <input type="number" formControlName="displayOrder" placeholder="1" min="1" />
            </div>

            <!-- Action Buttons -->
            <div class="modal-actions">
                <button type="submit" class="add-btn" [disabled]="isSaving">
                    {{ isSaving ? 'Adding...' : 'Add' }}
                </button>

                <button type="button" class="cancel-btn" [disabled]="isSaving" (click)="onCancel()">
                    Cancel
                </button>
            </div>

        </form>

    </div>
</div>
