<div class="auth-page">
    <!-- Background Accents -->
    <div class="top-left-lines"></div>
    <div class="bottom-left-wave"></div>
    <div class="right-dot-grid"></div>
    <div class="right-side-shape"></div>

    <div class="auth-card">
        <!-- Brand Logo -->
        <div class="logo-section">
            <img src="assets/images/logo1.jpg" alt="Superari Life Logo" class="logo-img" />
            <h1 class="brand-title">SUPERARI LIFE</h1>
            <p class="brand-subtitle">the will to overcome</p>
        </div>

        <!-- Title & Description -->
        <h2 class="form-title">Change Password</h2>
        <p class="form-subtitle">
            For security reasons, please change your temporary password.
        </p>

        <!-- Form -->
        <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="auth-form">
            <!-- Current Password -->
            <div class="form-group">
                <label>Current Password<span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" formControlName="currentPassword" placeholder="Enter current password"
                        [class.invalid-input]="changePasswordForm.get('currentPassword')?.touched && changePasswordForm.get('currentPassword')?.invalid" />
                    <button type="button" class="eye-icon-btn" aria-label="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- New Password -->
            <div class="form-group">
                <label>New Password<span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" formControlName="newPassword" placeholder="Enter new password"
                        [class.invalid-input]="changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.invalid" />
                    <button type="button" class="eye-icon-btn" aria-label="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password<span class="required">*</span></label>
                <div class="password-wrapper">
                    <input type="password" formControlName="confirmPassword" placeholder="Confirm new password"
                        [class.invalid-input]="changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.get('confirmPassword')?.invalid" />
                    <button type="button" class="eye-icon-btn" aria-label="Toggle password visibility">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                            </path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div class="error-alert" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" [disabled]="isLoading || changePasswordForm.invalid">
                @if (isLoading) {
                Changing...
                } @else {
                Change Password <span class="arrow">&rarr;</span>
                }
            </button>
        </form>
    </div>
</div>
