<div class="auth-page">
    <!-- Background Wave / Graphic Accents -->
    <div class="top-left-lines"></div>
    <div class="bottom-left-wave"></div>
    <div class="right-dot-grid"></div>
    <div class="right-side-shape"></div>

    <div class="auth-card">
        <!-- Logo & Branding -->
        <!-- <div class="logo-section">
            <img src="assets/images/logo1.jpg" alt="Superari Life Logo" class="logo-img" />
            <h1 class="brand-title">SUPERARI LIFE</h1>
            <p class="brand-subtitle">the will to overcome</p>
        </div> -->

        <div class="logo-section">
            <!-- Wing Logo on top -->
            <img src="assets/images/logo1.jpg" alt="Superari Life Logo" class="brand-logo-img" />

            <!-- Centered text block -->
            <div class="brand-text-container">
                <h1 class="brand-title">SUPERARI LIFE</h1>
                <div class="brand-underline"></div>
                <span class="brand-subtitle">the will to overcome</span>
            </div>
        </div>

        <!-- Title -->
        <h2 class="form-title">Forgot Password</h2>

        <!-- Form -->
        <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
            <div class="form-group">
                <label for="email">Enter Email<span class="required">*</span></label>
                <input id="email" type="email" formControlName="email" placeholder="johndoe@gmail.com"
                    [class.invalid-input]="form.get('email')?.touched && form.get('email')?.invalid" />
                @if (form.get('email')?.touched && form.get('email')?.invalid) {
                <small class="error-text">Please enter a valid email address.</small>
                }
            </div>

            <button type="submit" class="submit-btn" [disabled]="isLoading">
                @if (isLoading) {
                Sending...
                } @else {
                Send Reset Link On Email <span class="arrow">&rarr;</span>
                }
            </button>
        </form>

        <!-- Feedback Messages -->
        @if (message) {
        <p class="success-alert">
            {{ message }}
        </p>
        }

        @if (errorMessage) {
        <p class="error-alert">
            {{ errorMessage }}
        </p>
        }

        <!-- Navigation Link -->
        <div class="back-link-wrapper">
            <a routerLink="/login" class="back-link">
                Go To Back
            </a>
        </div>
    </div>
</div>
