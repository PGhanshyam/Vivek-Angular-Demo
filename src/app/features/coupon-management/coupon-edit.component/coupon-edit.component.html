<!-- Dark Background Overlay -->
<div class="coupon-modal-overlay" (click)="cancel()">

    <!-- Popup Container -->
    <div class="popup-container" (click)="$event.stopPropagation()">

        <!-- Header -->
        <div class="popup-header">
            <h2>Edit Coupon Code</h2>

            <button type="button" class="close-btn" (click)="cancel()" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
            </button>
        </div>

        <!-- Form -->
        <form [formGroup]="couponForm" (ngSubmit)="updateCoupon()" class="popup-form">

            <!-- Coupon Type -->
            <div class="form-group">
                <label>Coupon Type</label>
                <div class="select-wrapper">
                    <select formControlName="couponTypeId">
                        <option value="">Select Coupon Type</option>
                        <option *ngFor="let type of couponTypes" [value]="type.couponTypeId">
                            {{ type.couponTypeName }}
                        </option>
                    </select>
                </div>
            </div>

            <!-- Enter Coupon Code -->
            <div class="form-group">
                <label>Enter Coupon Code <span class="required">*</span></label>
                <div class="coupon-code">
                    <input type="text" formControlName="couponCode" placeholder="Enter Coupon Code">

                    <button type="button" class="generate-btn" (click)="autoGenerateCoupon()">
                        <svg class="barcode-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 5v14M7 5v14M11 5v14M15 5v14M19 5v14M21 5v14"></path>
                        </svg>
                        Auto Generate
                    </button>
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label>Description</label>
                <textarea rows="4" formControlName="description" placeholder="Enter Description"></textarea>
            </div>

            <!-- Dates Row -->
            <div class="row">
                <div class="col">
                    <label>Start Date <span class="required">*</span></label>
                    <input type="date" formControlName="startDate">
                </div>

                <div class="col">
                    <label>Expire Date <span class="required">*</span></label>
                    <input type="date" formControlName="expiryDate">
                </div>
            </div>

            <!-- Discount Row -->
            <div class="row">
                <div class="col">
                    <label>Discount Type <span class="required">*</span></label>
                    <div class="select-wrapper">
                        <select formControlName="discountType">
                            <option value="">Select..</option>
                            <option *ngFor="let item of discountTypes" [value]="item">
                                {{ item }}
                            </option>
                        </select>
                    </div>
                </div>

                <div class="col">
                    <label>Discount <span class="required">*</span></label>
                    <div class="discount-input-wrapper">
                        <input type="number" formControlName="discountValue" placeholder="0">
                        <span class="suffix-badge">
                            {{ couponForm.get('discountType')?.value === 'Fixed Amount' ? '£' : '%' }}
                        </span>
                    </div>
                </div>
            </div>

            <!-- Status -->
            <div class="form-group">
                <label>Status</label>

                <div class="select-wrapper">
                    <select formControlName="isActive">
                        <option [ngValue]="true">Active</option>
                        <option [ngValue]="false">Inactive</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button type="submit" class="update-btn">
                    Update
                </button>

                <button type="button" class="cancel-btn" (click)="cancel()">
                    Cancel
                </button>
            </div>

        </form>

    </div>

</div>
