<!-- Dark Background Overlay -->
<div class="edit-user-page" (click)="cancel()">

    <!-- Modal Container Card -->
    <div class="edit-user-card" (click)="$event.stopPropagation()">

        <!-- Header -->
        <div class="modal-header">
            <h2>Edit User</h2>

            <button type="button" class="close-button" (click)="cancel()" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                </svg>
            </button>
        </div>

        <!-- Form Content -->
        <form [formGroup]="editUserForm" (ngSubmit)="updateUser()" class="modal-form">

            <!-- Profile Image Section -->
            <div class="profile-section">
                <div class="profile-image-wrapper">
                    <img *ngIf="selectedImage" [src]="selectedImage" alt="User profile" class="profile-image"
                        (error)="handleImageError()" />

                    <div *ngIf="!selectedImage" class="profile-placeholder">
                        {{ user?.firstName?.charAt(0) }}{{ user?.lastName?.charAt(0) }}
                    </div>

                    <!-- Pink Camera Badge Icon -->
                    <label for="profileImage" class="image-upload-button" title="Change profile image">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                            stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </label>

                    <input id="profileImage" type="file" accept="image/*" hidden (change)="onImageSelected($event)" />
                </div>
            </div>

            <!-- First Name and Last Name -->
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" formControlName="firstName" placeholder="First Name"
                        [class.invalid-input]="editUserForm.get('firstName')?.touched && editUserForm.get('firstName')?.invalid" />
                    <small *ngIf="editUserForm.get('firstName')?.touched && editUserForm.get('firstName')?.invalid"
                        class="error-message">
                        First name is required.
                    </small>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" formControlName="lastName" placeholder="Last Name"
                        [class.invalid-input]="editUserForm.get('lastName')?.touched && editUserForm.get('lastName')?.invalid" />
                    <small *ngIf="editUserForm.get('lastName')?.touched && editUserForm.get('lastName')?.invalid"
                        class="error-message">
                        Last name is required.
                    </small>
                </div>
            </div>

            <!-- Role -->
            <div class="form-group full-width">
                <label>Role</label>
                <div class="select-wrapper">
                    <select formControlName="roleId">
                        <option value="">Select Role</option>
                        <option *ngFor="let role of roles" [value]="role.roleId">
                            {{ role.roleName }}
                        </option>
                    </select>
                </div>
            </div>

            <!-- Status -->
            <div class="form-group full-width">
                <label>Status</label>

                <div class="select-wrapper">
                    <select formControlName="isActive">
                        <option [ngValue]="true">Active</option>
                        <option [ngValue]="false">Inactive</option>
                    </select>
                </div>
            </div>

            <!-- Email and Phone -->
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" formControlName="email" placeholder="Email address"
                        [class.invalid-input]="editUserForm.get('email')?.touched && editUserForm.get('email')?.invalid" />
                    <small *ngIf="editUserForm.get('email')?.touched && editUserForm.get('email')?.invalid"
                        class="error-message">
                        Enter a valid email.
                    </small>
                </div>

                <div class="form-group">
                    <label>Phone No.</label>
                    <input type="text" formControlName="phoneNo" placeholder="Phone Number" />
                </div>
            </div>

            <!-- Address -->
            <div class="form-group full-width">
                <label>Address</label>
                <input type="text" formControlName="address" placeholder="Address" />
            </div>

            <!-- Country and State -->
            <div class="form-row">
                <div class="form-group">
                    <label>Country</label>
                    <div class="select-wrapper">
                        <select formControlName="country">
                            <option value="">Select Country</option>
                            <option *ngFor="let country of countries" [value]="country">
                                {{ country }}
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>State</label>
                    <div class="select-wrapper">
                        <select formControlName="state">
                            <option value="">Select State</option>
                            <option *ngFor="let state of states" [value]="state">
                                {{ state }}
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- City and ZIP Code -->
            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <div class="select-wrapper">
                        <select formControlName="city">
                            <option value="">Select City</option>
                            <option *ngFor="let city of cities" [value]="city">
                                {{ city }}
                            </option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Zip/Postal Code</label>
                    <input type="text" formControlName="zipCode" placeholder="Enter Zip/Postal Code" />
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-section">
                <button type="submit" class="update-button">
                    Update
                </button>

                <button type="button" class="cancel-button" (click)="cancel()">
                    Cancel
                </button>
            </div>

        </form>

    </div>

</div>
