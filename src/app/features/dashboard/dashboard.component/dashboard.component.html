<div class="dashboard-container">

    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Dashboard</h1>
            <p class="page-subtitle">Welcome to the Superari Life admin panel.</p>
        </div>
    </div>

    <!-- Section Title -->
    <h2 class="section-title">Overview</h2>

    <!-- Top Metric Cards Grid -->
    <div class="metrics-grid">

        <!-- Card 1: Total Users -->
        <div class="metric-card purple">
            <div class="card-header">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
            </div>
            <div class="card-info">
                <span class="label">Total Users</span>
                <h3 class="value">0</h3>
            </div>
            <!-- Decorative Smooth Wave Graph Background -->
            <svg class="wave-bg" viewBox="0 0 100 40" preserveAspectRatio="none">
                <path d="M0,30 Q25,5 50,25 T100,10 L100,40 L0,40 Z" fill="url(#purpleGrad)" />
                <defs>
                    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ab47bc" stop-opacity="0.35" />
                        <stop offset="100%" stop-color="#ab47bc" stop-opacity="0.0" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Card 2: Total Coupons -->
        <div class="metric-card orange">
            <div class="card-header">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                        <circle cx="12" cy="12" r="2"></circle>
                        <path d="M6 12h.01M18 12h.01"></path>
                    </svg>
                </div>
            </div>
            <div class="card-info">
                <span class="label">Total Coupons</span>
                <h3 class="value">0</h3>
            </div>
            <svg class="wave-bg" viewBox="0 0 100 40" preserveAspectRatio="none">
                <path d="M0,35 Q30,10 60,25 T100,15 L100,40 L0,40 Z" fill="url(#orangeGrad)" />
                <defs>
                    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ff7043" stop-opacity="0.35" />
                        <stop offset="100%" stop-color="#ff7043" stop-opacity="0.0" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Card 3: Active Users -->
        <div class="metric-card blue">
            <div class="card-header">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
            </div>
            <div class="card-info">
                <span class="label">Active Users</span>
                <h3 class="value">0</h3>
            </div>
            <svg class="wave-bg" viewBox="0 0 100 40" preserveAspectRatio="none">
                <path d="M0,25 Q20,35 50,15 T100,20 L100,40 L0,40 Z" fill="url(#blueGrad)" />
                <defs>
                    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#42a5f5" stop-opacity="0.35" />
                        <stop offset="100%" stop-color="#42a5f5" stop-opacity="0.0" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Card 4: Active Coupons -->
        <div class="metric-card green">
            <div class="card-header">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
            </div>
            <div class="card-info">
                <span class="label">Active Coupons</span>
                <h3 class="value">0</h3>
            </div>
            <svg class="wave-bg" viewBox="0 0 100 40" preserveAspectRatio="none">
                <path d="M0,30 Q35,5 70,20 T100,10 L100,40 L0,40 Z" fill="url(#greenGrad)" />
                <defs>
                    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#66bb6a" stop-opacity="0.35" />
                        <stop offset="100%" stop-color="#66bb6a" stop-opacity="0.0" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

    </div>

    <!-- Dashboard Welcome Content Card -->
    <div class="dashboard-content">
        <div class="welcome-card">
            <h2>Welcome to Superari Life</h2>
            <p>Use the sidebar to manage users and coupon codes.</p>
        </div>
    </div>

</div>
